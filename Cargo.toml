[workspace]
resolver = "3"
members = ["cli", "crates/efivar-store", "crates/efivar-store-uefi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
