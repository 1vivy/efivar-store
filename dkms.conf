PACKAGE_NAME="efivar-store"
PACKAGE_VERSION="1"
BUILT_MODULE_NAME[0]="efivar_store"
BUILT_MODULE_LOCATION[0]="linux"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# The outer wrapper selects KERNELRELEASE; prevent DKMS from injecting it here.
MAKE[0]="'make' -C linux KMI_SRC=${kernel_source_dir} ARCH=${arch} JOBS=4"
# Private imports still require exports or caller-owned ELF prebinding; never auto-load.
AUTOINSTALL="no"
